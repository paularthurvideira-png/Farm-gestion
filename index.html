<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Farm gestion"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#2f5d1f"><title>Farm gestion</title>
<style>
:root{--bg:#efe9d4;--card:#fffdf4;--ink:#2b2a22;--mut:#6f6b58;--g:#3f7d2a;--y:#e2a82b;--r:#b8442f;--line:#d8cfb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d15;--card:#2a2d21;--ink:#ece8d6;--mut:#a6a28b;--line:#42462f}}
:root[data-theme="dark"]{--bg:#1b1d15;--card:#2a2d21;--ink:#ece8d6;--mut:#a6a28b;--line:#42462f}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;min-height:100%}
header{background:#2f5d1f;color:#fff;padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;letter-spacing:2px}h2{margin:10px 0}
.hud{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.hud b{font-size:15px}.hud button{padding:2px 7px;font-size:12px}
#nav{display:flex;gap:4px;padding:8px 16px 0;flex-wrap:wrap}#nav button{border-radius:8px 8px 0 0;background:var(--line);color:var(--ink)}#nav .on{background:var(--g);color:#fff}
main{padding:12px 16px;max-width:1000px;margin:auto}
button{cursor:pointer;border:0;background:var(--g);color:#fff;padding:6px 12px;border-radius:6px;font-size:13px}button:disabled{opacity:.4;cursor:not-allowed}.sec{background:var(--line);color:var(--ink)}.red{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.tile{cursor:pointer;text-align:center;align-items:center}.tile:hover,.plus:hover{border-color:var(--g)}.dim{opacity:.55}.ic{font-size:30px}small,.mut{color:var(--mut)}
.plus{cursor:pointer;align-items:center;justify-content:center;font-size:13px;min-height:200px;border-style:dashed}.plus span{font-size:44px;color:var(--g)}
.art{height:72px;perspective:260px;display:grid;place-items:center;overflow:hidden}.art i{width:78%;height:100%;transform:rotateX(55deg) rotateZ(-8deg);border-radius:4px;box-shadow:6px 9px 0 rgba(0,0,0,.25);background:#7a6a4f}
.s-ploughed i{background:repeating-linear-gradient(90deg,#6b4a2b 0 7px,#80603a 7px 14px)}.s-cultivated i{background:repeating-linear-gradient(90deg,#8a6a43 0 3px,#9b7b52 3px 6px)}
.s-growing i{background:repeating-linear-gradient(90deg,var(--c) 0 5px,#4b3a22 5px 9px)}.s-ready i{background:repeating-linear-gradient(90deg,var(--c) 0 7px,#e6c36a 7px 10px);box-shadow:6px 9px 0 rgba(0,0,0,.25),0 0 10px var(--y)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;background:var(--y);width:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}.list{max-height:300px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;padding:7px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:var(--line)}
.fin .row{cursor:default}.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--r)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:9}.box{background:var(--card);padding:16px;border-radius:12px;width:min(440px,92vw);display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;gap:3px}select{padding:5px}
.wrap{display:flex;gap:12px}.side{display:flex;flex-direction:column;gap:6px}.side button{font-size:24px;background:var(--line);color:var(--ink)}.side .on{background:var(--g)}.main2{flex:1;min-width:0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:8px;color:#fff;background:var(--g);z-index:10;display:none}#toast.err{background:var(--r)}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"></head><body>
<header><h1>🚜 FARM GESTION</h1><span id="slots" class="acts"></span><div class="hud"><span>💰 <b id="m"></b></span><span>🕒 <b id="c"></b></span><span>⏩ x<b id="x"></b> <input id="sp" type="range" min="0" max="120" value="1" oninput="setMult(+this.value)"> <button class="sec" onclick="setMult(0)">x0</button><button class="sec" onclick="setMult(1)">x1</button><button class="sec" onclick="setMult(10)">x10</button><button class="sec" onclick="setMult(60)">x60</button><button class="sec" onclick="setMult(120)">x120</button></span><label style="display:flex;flex-direction:row;gap:4px;align-items:center;cursor:pointer" title="Lance les travaux et remplit les abreuvoirs sans fenêtre de validation"><input type="checkbox" id="qk" onchange="S.quick=this.checked;save()"> ⚡ Lancement direct</label><button class="red" onclick="newGame()">Nouvelle partie</button></div></header>
<div id="nav"></div><main id="main"></main><div id="ov"><div class="box" id="box"></div></div><div id="toast"></div>
<script>
// ===== DONNÉES FICTIVES (à remplacer par vos tableaux) =====
const DATA={
settings:{startMoney:400000,refSecPerHa:30,refWidth:6,slowFactor:10,saveKey:"farmingManagement_v1",workFactor:{labour:0.5,semis:0.5,recolte:0.5},fertPerHa:{fumier:3000,lisier:5000},fertBonus:0.2,manureCap:20000,slurryCap:30000,waterPrice:0.002},
crops:{ble:{n:"Blé",ico:"🌾",color:"#d9b24a",growH:8,yld:9000,price:0.25,cut:"grain"},
orge:{n:"Orge",ico:"🌾",color:"#c9a850",growH:7,yld:8500,price:0.23,cut:"grain"},
colza:{n:"Colza",ico:"🌼",color:"#e8d437",growH:10,yld:4000,price:0.55,cut:"grain"},
mais:{n:"Maïs",ico:"🌽",color:"#7fae3a",growH:12,yld:11000,price:0.20,cut:"mais"},
tournesol:{n:"Tournesol",ico:"🌻",color:"#e0a21c",growH:9,yld:3500,price:0.60,cut:"mais"},
soja:{n:"Soja",ico:"🫘",color:"#6f9a3a",growH:11,yld:3200,price:0.52,cut:"grain"},
herbe:{n:"Herbe",ico:"🌿",color:"#5fae3a",growH:6,yld:12000,price:0.08,cut:"grain"},
lait:{n:"Lait",ico:"🥛",price:0.5,g:1},laine:{n:"Laine",ico:"🧶",price:1.2,g:1},foin:{n:"Foin",ico:"🟨",price:0.12,g:1},ensilage:{n:"Ensilage",ico:"🥬",price:0.1,g:1}},
fields:Array.from({length:30},(_,i)=>({id:i+1,ha:+(1.5+((i*37)%50)/10).toFixed(1),pha:9000+(i*613)%4000})),
cats:{tracteur:"Tracteurs",cultivateur:"Cultivateurs",charrue:"Charrues",semoir:"Semoirs",engrais:"Épandeurs fumier et lisier",moissonneuse:"Moissonneuses-batteuses",barre:"Barres de coupe",ensileuse:"Ensileuses",barreens:"Barres de coupe pour ensileuses",faucheuse:"Faucheuses",andaineur:"Andaineurs",presse:"Presses à balles",remorque:"Remorques",chargeur:"Chargeurs et équipements"},
// hp = puissance (tracteur/moissonneuse : disponible ; outil/barre : requise), w = largeur (m), coef = multiplicateur de temps
shop:[
{id:"t1",cat:"tracteur",n:"Verdi 80",brand:"Agrolia",price:45000,hp:80,work:"Traction"},
{id:"t2",cat:"tracteur",n:"Verdi 150",brand:"Agrolia",price:95000,hp:150,work:"Traction"},
{id:"t3",cat:"tracteur",n:"Titan 250",brand:"Hartmann",price:180000,hp:250,work:"Traction"},
{id:"c1",cat:"cultivateur",n:"Gratte 3 m",brand:"Terrex",price:12000,hp:60,w:3,coef:1,work:"Cultiver"},
{id:"c2",cat:"cultivateur",n:"Cultimax 6 m",brand:"Terrex",price:28000,hp:120,w:6,coef:1,work:"Cultiver"},
{id:"p1",cat:"charrue",n:"Charrue 3 socs",brand:"Lemar",price:18000,hp:100,w:2,coef:1.2,work:"Labourer"},
{id:"p2",cat:"charrue",n:"Charrue 5 socs",brand:"Lemar",price:40000,hp:160,w:4,coef:1.2,work:"Labourer"},
{id:"s1",cat:"semoir",n:"Semoir 4 m",brand:"Seminor",price:22000,hp:80,w:4,coef:1,work:"Semer"},
{id:"s2",cat:"semoir",n:"Semoir 8 m",brand:"Seminor",price:50000,hp:140,w:8,coef:1,work:"Semer"},
{id:"m1",cat:"moissonneuse",n:"Moisson M100",brand:"Hartmann",price:150000,hp:250,coef:1,work:"Récolter"},
{id:"m2",cat:"moissonneuse",n:"Moisson M200",brand:"Hartmann",price:260000,hp:400,coef:0.8,work:"Récolter"},
{id:"b1",cat:"barre",n:"Barre céréales 4,5 m",brand:"Hartmann",price:20000,hp:200,w:4.5,coef:1,work:"Coupe céréales/colza/soja",cut:"grain"},
{id:"b2",cat:"barre",n:"Barre céréales 7,5 m",brand:"Hartmann",price:40000,hp:300,w:7.5,coef:1,work:"Coupe céréales/colza/soja",cut:"grain"},
{id:"b3",cat:"barre",n:"Cueilleur maïs 6 rangs",brand:"Hartmann",price:35000,hp:250,w:4.5,coef:1.1,work:"Coupe maïs/tournesol",cut:"mais"},
{id:"e1",cat:"engrais",n:"Épandeur à fumier 10 m³",brand:"Terrex",price:30000,hp:100,w:12,coef:1,work:"Fertiliser (fumier)",kind:"fumier"},
{id:"e2",cat:"engrais",n:"Tonne à lisier 12 000 L",brand:"Terrex",price:38000,hp:120,w:12,coef:1.1,work:"Fertiliser (lisier)",kind:"lisier"}]};
// Valeurs provisoires élevage : à remplacer. d = par animal et par jour de jeu ; foods = aliments acceptés (silo)
DATA.animals={
cow:{n:"Vaches",ico:"🐄",price:1500,sell:1200,cap:20,growH:48,food:90,water:100,prod:{k:"lait",d:25},vet:2,upkeep:3,manure:40,slurry:60,foods:["herbe","foin","ensilage"],breedH:72,rate:0.1,waterCap:3000,feedCap:3000},
pig:{n:"Cochons",ico:"🐖",price:400,sell:350,cap:40,growH:36,food:30,water:20,vet:1,upkeep:1,manure:0,slurry:15,foods:["ble","orge","mais","soja","colza","tournesol"],breedH:48,rate:0.15,waterCap:1500,feedCap:2000},
sheep:{n:"Moutons",ico:"🐑",price:250,sell:200,cap:40,growH:36,food:8,water:10,prod:{k:"laine",d:2},vet:0.5,upkeep:0.5,manure:6,slurry:0,foods:["herbe","foin"],breedH:60,rate:0.1,waterCap:800,feedCap:1000}};
// ===== MOTEUR =====
const D=DATA,$=s=>document.querySelector(s),it=id=>D.shop.find(x=>x.id===id);
const eur=n=>Math.abs(n)>=100000?(n/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" K€":n.toLocaleString("fr-FR",{maximumFractionDigits:2})+" €",num=n=>Math.abs(n)>=100000?(n/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" K":Math.round(n).toLocaleString("fr-FR");
const fmtT=s=>{s=Math.ceil(s);return s>=60?Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s":s+" s"};
const CI={tracteur:"🚜",cultivateur:"⛏️",charrue:"🔱",semoir:"🌱",moissonneuse:"🚛",barre:"✂️",engrais:"💩"},JL={labour:"Labourer",culture:"Cultiver",semis:"Semer",recolte:"Récolter",fert:"Fertiliser"};
const TABS=[["exploitation","Exploitation","🌾"],["magasin","Magasin","🏬"],["silo","Silo","🏗️"],["garage","Garage","🔧"],["finances","Finances","📊"]];
const S0=()=>({money:D.settings.startMoney,time:8*36e5,mult:1,own:[],fields:{},mach:[],jobs:[],silo:{},tx:[],uid:1});
function save(){try{localStorage.setItem(D.settings.saveKey,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(D.settings.saveKey);return r?JSON.parse(r):null}catch(e){return null}}
function ensure(){S.an=S.an||{};for(const k in D.animals)S.an[k]=S.an[k]||{ad:0,yg:[],food:100,water:100,health:100,feed:{},wl:0,out:0,col:S.time,acc:0};S.mn=S.mn||0;S.sl=S.sl||0;if(S.lastDay==null)S.lastDay=Math.floor(S.time/864e5)}
let S=load()||S0(),tab="exploitation",shopCat=null,last=Date.now(),W={};ensure();
function pay(l,a){S.money+=a;S.tx.unshift({t:S.time,l,a});if(S.tx.length>300)S.tx.length=300}
function toast(m,e){const t=$("#toast");t.textContent=m;t.className=e?"err":"";t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2600)}
function modal(h){$("#box").innerHTML=h;$("#ov").style.display="grid"}function closeM(){$("#ov").style.display="none"}
const busy=u=>S.jobs.some(j=>j.uids.includes(u)),prog=f=>Math.min(100,(S.time-f.t0)/(D.crops[f.crop].growH*36e5)*100);
function stamp(t){const d=Math.floor(t/864e5)+1,h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4);return "Jour "+d+" "+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")}
function calc(t,fid,a,b){const F=D.fields.find(x=>x.id==fid),pen=a.hp<b.hp?D.settings.slowFactor:1,k=t=="recolte"?a.coef*b.coef:b.coef;
return{pen,s:Math.max(1,F.ha*D.settings.refSecPerHa*k*(D.settings.refWidth/b.w)*pen*(D.settings.workFactor[t]||1))}}
function info(id){const f=S.fields[id],j=S.jobs.find(j=>j.fid==id),n=Date.now();
if(j){const p=Math.min(100,(n-j.start)/j.dur*100);return{t:JL[j.type]+" — reste "+fmtT((j.start+j.dur-n)/1000),p}}
if(f.st=="raw")return{t:"Terre brute",p:0};if(f.st=="ploughed")return{t:"Terre labourée",p:0};if(f.st=="cultivated")return{t:"Terre cultivée",p:0};
const c=D.crops[f.crop];if(f.st=="growing"){const p=prog(f);return{t:c.n+" en croissance — "+Math.floor(p)+" %",p}}return{t:c.n+" prête à récolter",p:100}}
function finish(j){const f=S.fields[j.fid],F=D.fields.find(x=>x.id==j.fid);
if(j.type=="fert")f.fert=1;else if(j.type=="labour")f.st="ploughed";else if(j.type=="culture")f.st="cultivated";
else if(j.type=="semis"){f.st="growing";f.crop=j.crop;f.t0=S.time}
else{const c=D.crops[f.crop],q=F.ha*c.yld*(f.fert?1+D.settings.fertBonus:1);S.silo[f.crop]=(S.silo[f.crop]||0)+q;toast("Récolte terminée : "+num(q)+" L de "+c.n+" ajoutés au silo");f.st="raw";f.crop=null;f.fert=0;return}
toast(JL[j.type]+" terminé — champ "+j.fid)}
function tick(){const n=Date.now(),dt=Math.min(n-last,2000);last=n;S.time+=dt*S.mult;let ch=false;if(S.mult>0)animStep(dt*S.mult);const dd=Math.floor(S.time/864e5);while(S.lastDay<dd){S.lastDay++;daily()}
S.jobs=S.jobs.filter(j=>{if(n>=j.start+j.dur){finish(j);ch=true;return false}return true});
for(const id in S.fields){const f=S.fields[id];if(f.st=="growing"&&prog(f)>=100){f.st="ready";ch=true;toast("Champ "+id+" : "+D.crops[f.crop].n+" prêt à récolter")}}
if(ch){render();save()}else upd()}
function upd(){$("#m").textContent=eur(S.money);$("#c").textContent=stamp(S.time);$("#x").textContent=S.mult;$("#sp").value=S.mult;
document.querySelectorAll("[data-f]").forEach(e=>{const i=info(e.dataset.f);e.querySelector(".pct").textContent=i.t;e.querySelector(".bar b").style.width=i.p+"%"});if(an&&$("#live"))$("#live").innerHTML=live(an);document.querySelectorAll("[data-b]").forEach(e=>e.textContent=alr(e.dataset.b)?"⚠️":"")}
function setMult(v){S.mult=v;upd();save()}
function go(t){tab=t;render()}
function render(){$("#nav").innerHTML=TABS.map(([k,l,i])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${i} ${l}</button>`).join("");
$("#main").innerHTML=({exploitation:vExp,magasin:vShop,silo:vSilo,garage:vGar,finances:vFin})[tab]();upd()}
// ----- Exploitation
function vFields(){return `<div class="grid">${S.own.map(card).join("")}<div class="card plus" onclick="openBuyField()"><span>+</span>Acheter un champ</div></div>`}
function card(id){const F=D.fields.find(x=>x.id==id),f=S.fields[id],j=S.jobs.find(j=>j.fid==id),c=f.crop?D.crops[f.crop]:null;
const B=t=>`<button onclick="openWork(${id},'${t}')">${JL[t]}</button>`;let b="";
if(!j){if(f.st=="raw")b=B("labour")+B("culture");else if(f.st=="ploughed")b=B("culture");else if(f.st=="cultivated")b=B("semis")+(f.fert?"":B("fert"));else if(f.st=="growing"&&!f.fert)b=B("fert");else if(f.st=="ready")b=B("recolte")}
return `<div class="card" data-f="${id}"><b>Champ ${id}</b><span class="mut">${F.ha} ha</span><div class="art s-${f.st}" style="--c:${c?c.color:"#7a6a4f"}"><i></i></div><span>${c?c.ico+" "+c.n:"Aucune culture"}${f.fert?" · fertilisé":""}</span><span class="pct mut"></span><div class="bar"><b></b></div><div class="acts">${b}</div></div>`}
function openBuyField(){const l=D.fields.filter(x=>!S.own.includes(x.id));
modal(`<h2>Acheter un champ</h2>${l.length?`<div class="list">${l.map(x=>`<div class="row" onclick="confirmField(${x.id})"><b>Champ ${x.id}</b><span>${x.ha} ha</span><span>${eur(x.ha*x.pha)}</span></div>`).join("")}</div>`:"<p>Aucun champ disponible.</p>"}<div class="acts"><button class="sec" onclick="closeM()">Fermer</button></div>`)}
function confirmField(id){const x=D.fields.find(f=>f.id==id),p=x.ha*x.pha;
modal(`<h2>Champ ${id}</h2><p>Superficie : <b>${x.ha} ha</b><br>Prix : <b>${eur(p)}</b></p>${S.money<p?`<p class="warn">Solde insuffisant.</p>`:""}<div class="acts"><button onclick="buyField(${id})">Acheter</button><button class="sec" onclick="openBuyField()">Annuler</button></div>`)}
function buyField(id){const x=D.fields.find(f=>f.id==id),p=x.ha*x.pha;if(S.own.includes(id))return;if(S.money<p)return toast("Solde insuffisant","e");
pay("Achat champ "+id,-p);S.own.push(id);S.fields[id]={st:"raw"};closeM();render();save();toast("Champ "+id+" acheté")}
// ----- Travaux
function opts(cat,fn){return S.mach.filter(m=>it(m.id).cat==cat&&!busy(m.uid)&&(!fn||fn(it(m.id)))).map(m=>`<option value="${m.uid}">${it(m.id).n} (${it(m.id).hp} ch)</option>`).join("")}
function openWork(id,t){W={id,t};const f=S.fields[id],r=t=="recolte";
const ca=r?"moissonneuse":"tracteur",cb={labour:"charrue",culture:"cultivateur",semis:"semoir",recolte:"barre",fert:"engrais"}[t];
const A=opts(ca),B=opts(cb,r?x=>x.cut==D.crops[f.crop].cut:null);
let h=`<h2>${JL[t]} — Champ ${id}</h2>`;
if(t=="semis")h+=`<label>Culture<select id="cr">${Object.entries(D.crops).filter(([k,c])=>!c.g).map(([k,c])=>`<option value="${k}">${c.ico} ${c.n} (${c.growH} h)</option>`).join("")}</select></label>`;
h+=`<label>${r?"Moissonneuse":"Tracteur"}<select id="a" onchange="est()">${A}</select></label><label>${r?"Barre de coupe":"Outil"}<select id="b" onchange="est()">${B}</select></label>`;
if(!A||!B)h+=`<p class="warn">Matériel manquant ou occupé — voir le Magasin.</p>`;
modal(h+`<div id="es"></div><div class="acts"><button id="go" onclick="startWork()">Lancer</button><button class="sec" onclick="closeM()">Annuler</button></div>`);est()}
function pick(){const a=S.mach.find(m=>m.uid==($("#a")||{}).value),b=S.mach.find(m=>m.uid==($("#b")||{}).value);return[a,b]}
function est(){const[a,b]=pick();if(!a||!b){$("#es").textContent="";$("#go").disabled=true;return}
const r=calc(W.t,W.id,it(a.id),it(b.id)),fq=W.t=="fert"?fertNeed(it(b.id)):null;$("#es").innerHTML=(fq?`${fq.k} nécessaire : <b>${num(fq.q)} L</b> (stock ${num(fq.s)} L)<br>${fq.s<fq.q?"<span class='warn'>Stock insuffisant</span><br>":""}`:"")+`Durée : <b>${fmtT(r.s)}</b>${r.pen>1?`<br><span class="warn">⚠ Puissance insuffisante : temps ×${r.pen}</span>`:""}`;$("#go").disabled=!!(fq&&fq.s<fq.q)}
function startWork(){const[a,b]=pick();if(!a||!b)return toast("Sélectionnez le matériel","e");
if(busy(a.uid)||busy(b.uid))return toast("Matériel déjà occupé","e");if(S.jobs.some(j=>j.fid==W.id))return toast("Champ déjà en travaux","e");

closeM();render();save()}

let an=null;const mt=(v,ok,g)=>Math.max(0,Math.min(100,v+(ok?1:-1)*g/432e5*100)),tot=a=>a.ad+a.yg.length;
function animStep(g){const fr=g/864e5;for(const k in D.animals){const A=D.animals[k],a=S.an[k],n=tot(a);
const keep=[];a.yg.forEach(t=>{if(S.time-t>=A.growH*36e5)a.ad++;else keep.push(t)});a.yg=keep;if(!n)continue;
const need=n*A.food*fr;let got=0;
for(const f of A.foods){const t=Math.min(need-got,a.feed[f]||0);a.feed[f]=(a.feed[f]||0)-t;got+=t}
for(const f of A.foods){const t=Math.min(need-got,S.silo[f]||0);S.silo[f]=(S.silo[f]||0)-t;got+=t}
const wn=n*A.water*fr,wg=Math.min(wn,a.wl);a.wl-=wg;
a.food=mt(a.food,got>=need*.999,g);a.water=mt(a.water,wg>=wn*.999,g);a.health=mt(a.health,a.food>20&&a.water>20,g);
const wf=(a.food+a.water+a.health)/300;if(A.prod)a.out+=a.ad*A.prod.d*wf*fr;
S.mn=Math.min(D.settings.manureCap,S.mn+n*A.manure*fr);S.sl=Math.min(D.settings.slurryCap,S.sl+n*A.slurry*fr);
if(a.ad>=2&&wf>.7){a.acc+=a.ad*A.rate*g/(A.breedH*36e5);while(a.acc>=1){a.acc--;if(tot(a)<A.cap)a.yg.push(S.time)}}}}
function daily(){for(const k in D.animals){const A=D.animals[k],n=tot(S.an[k]);if(!n)continue;pay("Frais vétérinaires — "+A.n,-n*A.vet);pay("Entretien installations — "+A.n,-n*A.upkeep)}if(S.money<0)toast("⚠ Alerte financière : solde négatif","e")}
function alr(k){const a=S.an[k];return tot(a)>0&&(a.food<30||a.water<30||a.health<30)}
function vExp(){return `<div class="wrap"><div class="side"><button class="${an?"":"on"}" onclick="an=null;render()">🌾</button>${Object.entries(D.animals).map(([k,A])=>`<button class="${an==k?"on":""}" title="${A.n}" onclick="an='${k}';render()">${A.ico}<span data-b="${k}"></span></button>`).join("")}</div><div class="main2">${an?vAn(an):vFields()}</div></div>`}
function vAn(k){const A=D.animals[k];return `<h2>${A.ico} ${A.n}</h2><div class="acts"><button onclick="openBuyAn('${k}')">Acheter des animaux</button><button onclick="fillFeed('${k}')">Remplir les mangeoires</button><button onclick="openWater('${k}')">Remplir les abreuvoirs</button>${A.prod?`<button onclick="collect('${k}')">Récupérer ${A.prod.k=="lait"?"le lait":"la laine"}</button>`:""}<button class="red" onclick="openSellAn('${k}')">Vendre</button></div><div class="card" id="live" style="margin-top:10px">${live(k)}</div>`}
function live(k){const A=D.animals[k],a=S.an[k],n=tot(a),B=(l,v)=>`<div>${l} ${Math.round(v)} %<div class="bar"><b style="width:${v}%"></b></div></div>`;
const fl=Object.values(a.feed).reduce((s,v)=>s+v,0),age=a.yg.length?Math.round(a.yg.reduce((s,t)=>s+(S.time-t)/(A.growH*36e5),0)/a.yg.length*100):0,w=(a.food+a.water+a.health)/3,nx=864e5-(S.time-a.col);
let h=`<p>Animaux : <b>${n} / ${A.cap}</b> (adultes ${a.ad}, jeunes ${a.yg.length}${a.yg.length?` · croissance moy. ${age} %`:""})<br>Dépenses : <b>${eur(n*(A.vet+A.upkeep))}</b> / jour</p>`+B("❤️ Santé",a.health)+B("🍽️ Alimentation",a.food)+B("💧 Eau",a.water)+B("😊 Bien-être",w);
h+=`<p>Mangeoire : ${num(fl)} L · Abreuvoirs : ${num(a.wl)} / ${A.waterCap} L</p>`;
if(A.prod)h+=`<p>${D.crops[A.prod.k].ico} ${D.crops[A.prod.k].n} produit : <b>${num(a.out)} L</b> ${nx>0?`<small>(récoltable dans ${Math.ceil(nx/36e5)} h de jeu)</small>`:""}</p>`;
h+=`<p>Fumier : ${num(S.mn)} / ${D.settings.manureCap} L · Lisier : ${num(S.sl)} / ${D.settings.slurryCap} L</p>`;
if(a.food<30&&n)h+=`<p class="warn">⚠ Manque de nourriture (silo : ${A.foods.map(f=>D.crops[f].n).join(", ")})</p>`;
if(a.water<30&&n)h+=`<p class="warn">⚠ Abreuvoirs vides</p>`;
if(S.mn>=D.settings.manureCap||S.sl>=D.settings.slurryCap)h+=`<p class="warn">⚠ Réserve de fumier/lisier pleine</p>`;return h}
